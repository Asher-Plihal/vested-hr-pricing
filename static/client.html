<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VestedHR — Client</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* Shared table styles */
    .tbl-fixed { table-layout: fixed; }
    .tbl-fixed th, .tbl-fixed td { padding: 5px 4px; text-align: center; }
    .tbl-fixed td input, .tbl-fixed td select { min-width: 0; width: 100%; box-sizing: border-box; text-align: center; padding: 4px 3px; }
    /* Remove mode */
    tbody.remove-mode tr { cursor: pointer; }
    tbody.remove-mode tr:hover td { background: #fff1f1 !important; }
    tbody.remove-mode td input, tbody.remove-mode td select { pointer-events: none; cursor: pointer; }
    tbody tr.tbl-row-selected td { background: #fca5a5 !important; color: #7f1d1d; }
    /* WC codes — description col left-aligned */
    #wc-codes-table th:nth-child(3), #wc-codes-table td:nth-child(3) { text-align: left; }
    #wc-codes-table td:nth-child(3) input { text-align: left; }
    /* Proposal WC table — compact padding, smaller font, truncate description col */
    #proposal-wc-table { font-size: 0.8rem; }
    #proposal-wc-table th, #proposal-wc-table td { padding: 5px 6px; }
    #proposal-wc-table th:nth-child(3), #proposal-wc-table td:nth-child(3) { text-align: left; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Annual Billing Analysis — single wide table */
    #analysis-table { font-size: 0.8rem; }
    #analysis-table th, #analysis-table td { padding: 5px 6px; }
    /* Group header row — blank identifier cells have no border */
    #analysis-table thead tr:first-child th { border-bottom: none; background: transparent; text-transform: none; letter-spacing: 0; }
    /* Group label cells — gold underline, navy text */
    #analysis-table thead tr:first-child th.analysis-group-label { color: #1e3154; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; border-bottom: 2px solid #c9a84c; padding-bottom: 4px; }

    /* State picker */
    .state-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      background: #fff;
    }
    .state-picker:focus-within {
      border-color: #c9a84c;
      box-shadow: 0 0 0 3px rgba(201,168,76,0.18);
    }
    .state-pill {
      padding: 4px 9px;
      border-radius: 20px;
      border: 1px solid #cbd5e0;
      background: #f7fafc;
      color: #4a5568;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
      user-select: none;
      font-family: inherit;
    }
    .state-pill:hover { border-color: #c9a84c; color: #1e3154; background: #fdf8ec; }
    .state-pill.selected { background: #1e3154; border-color: #1e3154; color: #fff; }
    .state-pill.selected:hover { background: #162644; border-color: #162644; }
    .state-count { font-size: 0.75rem; color: #718096; margin-top: 6px; }
    .state-count strong { color: #1e3154; }

    /* Compliance / WC question rows (prototype style) */
    .q-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .q-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #f0f2f6;
    }
    .q-row:last-child { border-bottom: none; }
    .q-row:nth-child(odd) { background: #fafbfc; }
    .q-grid .q-row:nth-child(4n+1),
    .q-grid .q-row:nth-child(4n+2) { background: #fafbfc; }
    .q-grid .q-row:nth-child(4n+3),
    .q-grid .q-row:nth-child(4n) { background: #fff; }
    .q-label {
      flex: 1;
      min-width: 0;
      font-size: 0.85rem;
      color: #2d3748;
    }
    .q-select {
      width: 80px;
      flex-shrink: 0;
      padding: 5px 8px;
      font-size: 0.82rem;
    }
    .q-explain {
      flex: 0 0 100%;
      width: 100%;
      padding: 5px 8px;
      font-size: 0.82rem;
      box-sizing: border-box;
    }
    .compliance-rows .q-row { border-bottom: 1px solid #f0f2f6; }
    .compliance-rows .q-row:nth-child(odd) { background: #fafbfc; }
    .compliance-rows .q-row:nth-child(even) { background: #fff; }

    /* Admin Fee method boxes */
    .admin-method-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .admin-method-box {
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      font-size: 0.88rem;
      font-weight: 600;
      color: #4a5568;
      user-select: none;
    }
    .admin-method-box:hover { border-color: #4a90d9; background: #f0f7ff; color: #1e3154; }
    .admin-method-box.selected { border-color: #1e3154; background: #eef4fb; color: #1e3154; }

    /* Commission note + info rows */
    .commission-note {
      background: #fffbea;
      border: 1px solid #f6e05e;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: #744210;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .commission-info-rows {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .commission-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      font-size: 0.85rem;
    }
    .commission-info-row:nth-child(odd) { background: #fafbfc; }
    .commission-info-row:nth-child(even) { background: #fff; }
    .commission-info-label { color: #2d3748; }
    .commission-info-value { font-weight: 600; color: #1e3154; }
    .comm-input { width: 100px; text-align: right; padding: 4px 6px; font-size: 0.82rem; }

    .q-note {
      flex: 0 0 100%;
      background: #fffbeb;
      border: 1px solid #f59e0b;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 0.8rem;
      color: #92400e;
      display: none;
    }

    /* Inline note after select (for new_company / gaps) */
    .inline-note {
      display: none;
      font-size: 0.82rem;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 5px;
      padding: 5px 10px;
      margin-top: 6px;
    }

    /* WC extra fields grid */
    .wc-extra-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 24px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }

    /* Deal Summary */
    .deal-summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 32px;
    }
    .ds-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid #f0f2f6;
    }
    .ds-label { font-size: 0.875rem; color: #4a5568; }
    .ds-value { font-size: 0.9rem; font-weight: 600; color: #1a202c; }
    .ds-row.total {
      border-top: 2px solid #eab308;
      border-bottom: none;
      background: #fefce8;
      margin-left: -28px;
      margin-right: -28px;
      padding-left: 28px;
      padding-right: 28px;
      margin-top: 4px;
      padding-top: 10px;
    }
    .ds-row.total .ds-label { font-weight: 700; color: #1e3154; font-size: 0.95rem; }
    .ds-row.total .ds-value { font-size: 1rem; color: #1e3154; }
    .ds-value.positive { color: #16a34a; }
    .ds-value.negative { color: #dc2626; }
    .ds-value.ds-dual { display: flex; gap: 12px; align-items: center; }
    .ds-secondary { font-size: 0.82rem; color: #64748b; font-weight: 500; }

    /* Pricing: admin method row */
    .pricing-method-row { display: flex; align-items: center; gap: 16px; }

    /* SUTA inline */
    .suta-inline {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .suta-min-note {
      font-size: 0.82rem;
      color: #718096;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      padding: 6px 12px;
    }

    /* Add Row button (dashed gold) */
    .btn-add-row {
      margin-top: 10px;
      padding: 7px 16px;
      border-radius: 6px;
      border: 1px dashed #c9a84c;
      background: #fdf8ec;
      color: #7a6020;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-add-row:hover { background: #f7edd5; }

    /* Location rows */
    .location-row {
      display: grid;
      grid-template-columns: 1fr 140px auto;
      gap: 8px;
      align-items: center;
    }
    .location-row input { width: 100%; }
    .location-row .btn-remove-loc {
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      background: transparent;
      color: #a0aec0;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      line-height: 1.4;
    }
    .location-row .btn-remove-loc:hover { color: #dc2626; border-color: #fecaca; background: #fff5f5; }

    /* Tab action buttons — kept separate from .btn-ghost: heavier weight (600), gold border on hover, .primary variant */
    .tab-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 13px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #4a5568;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      white-space: nowrap;
      font-family: inherit;
    }
    .tab-action-btn:hover { background: #f4f5f7; border-color: #c9a84c; color: #1e3154; }
    .tab-action-btn.primary { background: #1e3154; border-color: #1e3154; color: #fff; }
    .tab-action-btn.primary:hover { background: #162644; border-color: #162644; }

    /* req-legend inside subheader-top */
    .req-legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 4px;
      align-items: flex-end;
    }
    .req-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #718096;
    }
    .req-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .req-dot-y { background: #ca8a04; }
    .req-dot-g { background: #16a34a; }

    /* card-divider */
    .card-divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    /* WC codes totals row */
    .data-table tr.totals-row td {
      background: #f3f5fa;
      font-weight: 600;
      font-size: 0.85rem;
      color: #1e3154;
      padding: 8px 10px;
      border-top: 2px solid #e2e8f0;
    }
    .data-table tr.totals-row input {
      background: #f3f5fa;
      font-weight: 600;
      color: #1e3154;
      border-color: #e2e8f0;
    }

    /* WC codes table — compact, no horizontal scroll */
    #wc-codes-table th {
      white-space: normal;
      text-align: center;
      vertical-align: bottom;
      padding: 5px 4px;
      line-height: 1.25;
    }
    #wc-codes-table td {
      padding: 5px 4px;
    }
    #wc-codes-table tfoot td {
      padding: 6px 4px;
    }
    #wc-codes-table td select[name^="wc_state_"] {
      width: auto !important;
      min-width: 0 !important;
    }

    /* Billing Analysis section headers */
    .analysis-section-hdr td {
      background: #eef1f7;
      font-weight: 700;
      font-size: 0.77rem;
      color: #1e3154;
      padding: 7px 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Loss Analysis summary row */
    .la-summary-row {
      display: flex;
      gap: 0;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
    }
    .la-stat {
      flex: 1;
      padding: 10px 14px;
      border-right: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .la-stat:last-child { border-right: none; }
    .la-stat-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #718096;
      margin-bottom: 4px;
    }
    .la-stat-value {
      font-size: 1rem;
      font-weight: 600;
      color: #2d3748;
    }

    /* Loss Analysis derived metrics */
    .la-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 24px;
    }

    /* Card lock button */
    .card-lock-btn {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 0 0 8px;
      line-height: 1;
      flex-shrink: 0;
    }
  </style>
</head>
