    <!-- Compliance Questionnaire -->
    <div class="card" data-card-id="compliance" data-locked="true">
      <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
        <span>Compliance Questions <span class="req-section-badge y">Required for estimate</span></span>
        <button type="button" class="card-lock-btn" onclick="toggleCardLock(this)" title="Unlock to edit">🔒</button>
      </div>
      <hr class="card-divider" />
      <div class="compliance-rows" id="compliance-rows">

        <div class="q-row">
          <span class="q-label">EEOC Violations</span>
          <select class="q-select" name="eeoc_violations" onchange="toggleQExplain(this)">
            <option value="false" selected>No</option>
            <option value="true">Yes</option>
          </select>
          <textarea class="q-explain" name="eeoc_explanation" placeholder="Explain…" rows="3" style="display:none"></textarea>
        </div>

        <div class="q-row">
          <span class="q-label">Active Claims</span>
          <select class="q-select" name="active_claims" onchange="toggleQExplain(this)">
            <option value="false" selected>No</option>
            <option value="true">Yes</option>
          </select>
          <textarea class="q-explain" name="active_claims_explanation" placeholder="Explain…" rows="3" style="display:none"></textarea>
        </div>

        <div class="q-row">
          <span class="q-label">COBRA / Continuation</span>
          <select class="q-select" name="cobra_continuation" onchange="toggleQExplain(this)">
            <option value="false" selected>No</option>
            <option value="true">Yes</option>
          </select>
          <textarea class="q-explain" name="cobra_explanation" placeholder="Explain…" rows="3" style="display:none"></textarea>
        </div>

        <div class="q-row">
          <span class="q-label">Past Layoffs</span>
          <select class="q-select" name="past_layoffs" onchange="toggleQExplain(this)">
            <option value="false" selected>No</option>
            <option value="true">Yes</option>
          </select>
          <textarea class="q-explain" name="past_layoffs_explanation" placeholder="Explain…" rows="3" style="display:none"></textarea>
        </div>

        <div class="q-row">
          <span class="q-label">Future Layoffs</span>
          <select class="q-select" name="future_layoffs" onchange="toggleQExplain(this)">
            <option value="false" selected>No</option>
            <option value="true">Yes</option>
          </select>
          <textarea class="q-explain" name="future_layoffs_explanation" placeholder="Explain…" rows="3" style="display:none"></textarea>
        </div>

        <div class="q-row">

            <option value="true">Yes</option>
          </select>
          <textarea class="q-explain" name="leave_explanation" placeholder="Explain…" rows="3" style="display:none"></textarea>
