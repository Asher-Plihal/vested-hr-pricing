<!-- ═══════════════════════════════════════════════════
     LAYOUT
════════════════════════════════════════════════════ -->
<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Main</div>
      <a href="/static/dashboard.html" class="sidebar-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="#" class="sidebar-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

        Quotes
      </a>
    </div>
    <hr class="sidebar-divider" />
    <div class="sidebar-section">
      <div class="sidebar-label">Tools</div>
      <a href="/static/config.html" class="sidebar-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M12 2v2M12 20v2M20 12h2M2 12H4M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41"/></svg>
        Configuration
      </a>
      <a href="#" class="sidebar-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Reports
      </a>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">

    <!-- Header row -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px">
      <div>
        <div class="page-title">Dashboard</div>
        <div class="page-sub">Welcome back, Asher — here's what's happening.</div>
      </div>
      <button class="btn-new" id="btn-new-quote" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Quote
      </button>
    </div>

    <!-- Stat cards -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Active Quotes</div>
        <div class="stat-value" id="stat-active-quotes">—</div>
        <div class="stat-sub">draft &amp; in review</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Clients</div>
        <div class="stat-value" id="stat-total-clients">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg. Admin Rate</div>
        <div class="stat-value"><span class="stat-accent">—</span></div>
        <div class="stat-sub">of gross wages</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total GWs (MTD)</div>
        <div class="stat-value">—</div>
        <div class="stat-sub">across all active clients</div>
      </div>
    </div>

    <!-- Recent quotes -->
    <div class="section-head">Recent Quotes</div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div id="quotes-table-wrap">
        <div class="empty-state">Loading…</div>
      </div>
    </div>

  </main>

</div>

<script src="/static/app.js"></script>
<script>

/* ── Helpers ────────────────────────────────────────────────────────────────── */

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function statusBadge(status) {
  const map = {
    draft:     'badge-draft',
    in_review: 'badge-in-review',
    approved:  'badge-approved',
  };
  const cls   = map[status] || 'badge-draft';
  const label = status ? status.replace('_', ' ') : 'draft';
  return `<span class="badge ${cls}">${label}</span>`;
}

/* ── New Quote ──────────────────────────────────────────────────────────────── */

async function createNewQuote() {
  try {
    const result = await apiPost('/clients', {});
    window.location.href = `/static/client.html?id=${result.id}`;
  } catch (err) {
    showToast('Failed to create quote: ' + err.message, 'error');
  }
}

document.getElementById('btn-new-quote').addEventListener('click', createNewQuote);

/* ── Load dashboard data ────────────────────────────────────────────────────── */

async function loadDashboard() {
  let clients = [];
  try {
    clients = await apiGet('/clients');
  } catch (err) {
    showToast('Failed to load clients: ' + err.message, 'error');
    document.getElementById('quotes-table-wrap').innerHTML =
      '<div class="empty-state">Failed to load data.</div>';
    return;
  }

  // Stat cards
  const total  = clients.length;
  const active = clients.filter(c => c.status === 'draft' || c.status === 'in_review').length;
  document.getElementById('stat-total-clients').textContent  = total;
  document.getElementById('stat-active-quotes').textContent  = active;

  // Table
  const wrap = document.getElementById('quotes-table-wrap');

  if (total === 0) {
    wrap.innerHTML = `
      <div class="empty-state">
        No quotes yet.
        <a id="empty-new-quote">Create your first quote →</a>
      </div>`;
    document.getElementById('empty-new-quote').addEventListener('click', createNewQuote);
    return;
  }

  const rows = clients.map(c => `
    <tr data-id="${c.id}">
      <td><strong>${c.legal_name || '<span style="color:#a0aec0;font-weight:400;">Unnamed</span>'}</strong></td>
      <td>${c.consultant_name || '—'}</td>
      <td></td>
      <td></td>
      <td>${statusBadge(c.status)}</td>
      <td>${formatDate(c.updated_at)}</td>
    </tr>
  `).join('');

  wrap.innerHTML = `
    <table class="clients-table">
      <thead>
        <tr>
          <th>Client</th>
          <th>Consultant</th>
          <th>EEs</th>
          <th>Gross Wages</th>
          <th>Status</th>
          <th>Last Updated</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;

  wrap.querySelectorAll('tr[data-id]').forEach(row => {
    row.addEventListener('click', () => {
      window.location.href = `/static/client.html?id=${row.dataset.id}`;
    });
  });
}

loadDashboard();
</script>
</body>
</html>
